<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>inert-outside.ts</title>
<style>
[inert] {
  pointer-events: none;
  user-select: none;
  opacity: 0.5;
}
</style>
</head>
<body>

<section>
  <h2>Light DOM</h2>
  <button id="btn-1">Button 1</button>
  <button id="btn-2" tabindex="3">TabIndex 3</button>
  <button id="btn-3" tabindex="1">TabIndex 1</button>
  <div id="div-1" tabindex="0" >Div focusable</div>
</section>

<section>
  <h2>Radio group</h2>
  <div>
    <input id="radio-1-1" name="group1" type="radio" />Radio 1
    <input id="radio-1-2" name="group1" type="radio" />Radio 2
    <input id="radio-1-3" name="group1" type="radio" />Radio 3
  </div>
  <div>
    <input id="radio-2-1" name="group2" type="radio" />Radio 1
    <input checked id="radio-2-2" name="group2" type="radio" />Radio 2
    <input id="radio-2-3" name="group2" type="radio" />Radio 3
  </div>
  <div>
    <input disabled id="radio-3-1" name="group3" type="radio" />Radio 1
    <input id="radio-3-2" name="group3" type="radio" />Radio 2
    <input id="radio-3-3" name="group3" type="radio" />Radio 3
  </div>
  <div>
    <input disabled id="radio-4-1" name="group3" type="radio" />Radio 1
    <input disabled id="radio-4-2" name="group3" type="radio" />Radio 2
    <input disabled id="radio-4-3" name="group3" type="radio" />Radio 3
  </div>
  <div>
    <input id="radio-5-1" type="radio" />Radio
  </div>
  <div>
    <input id="radio-6-1" type="radio" />Radio
  </div>
  <div>
    <input disabled id="radio-7-1" type="radio" />Radio
  </div>
</section>

<section>
  <h2>Light DOM</h2>
  <button id="btn-1">Button 1</button>
  <button id="btn-2" tabindex="3">TabIndex 3</button>
  <button id="btn-3" tabindex="1">TabIndex 1</button>
  <div id="div-1" tabindex="0" >Div focusable</div>
</section>

<section inert>
  <h2>Light DOM</h2>
  <button id="btn-1">Button 1</button>
  <button id="btn-2" tabindex="3">TabIndex 3</button>
  <button id="btn-3" tabindex="1">TabIndex 1</button>
  <div id="div-1" tabindex="0" >Div focusable</div>
</section>


<script type="module">
import { inertOutside } from 'https://esm.sh/power-focusable';

const cleanup = inertOutside(document.querySelectorAll('section')[1]);

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    cleanup();
  }
});
</script>
</body>
</html>
